[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-code"
version = "1.0.0"
description = "A Python CLI coding agent with tools, skills, MCP, memory, and code graph search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "rich>=13.0.0",
    "tree-sitter>=0.23.0,<1",
    "tree-sitter-language-pack>=0.3.0,<1",
]

[project.scripts]
graph-code = "mini_claude.__main__:main"

[tool.setuptools.packages.find]
include = ["mini_claude*"]

[tool.setuptools.package-data]
mini_claude = ["system_prompt.md"]

